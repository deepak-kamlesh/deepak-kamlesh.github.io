# Site Settings
title: "Deepak Kamlesh"
locale: "en-US"
url: "https://deepak-kamlesh.github.io/"
baseurl: ""

# Theme Customization (Minimal Mistakes default)
theme: "minimal-mistakes-jekyll"
minimal_mistakes_skin: "default" # Try changing to "air", "mint", or "contrast" later!

# Site Metadata
description: "Personal Academic Website of Deepak Kamlesh - Theoretical Mathematician"
logo: null

# Site Author Profile (Populates left-hand sidebar)
author:
  name: "Dr. Deepak Kamlesh"
  avatar: "/assets/images/square-crop-website-profile-pic1.jpg" # Place your headshot here later
  bio: "Mathematician working at the interface of arithmetic geometry, number theory and mathematical physics, with particular interests in periods, motives and scattering amplitudes."
  location: "Bonn, Germany"
  links:
    #- label: "GitHub"
    #  icon: "fab fa-fw fa-github"
    #  url: "https://deepak-kamlesh.github.io/"
    # Remove the '#' from the lines below when you have these links ready:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:deepakkamlesh6@gmail.com"
    - label: "arXiv"
      icon: "fas fa-fw fa-book"
      url: "https://arxiv.org/a/kamlesh_d_1"
    - label: "Inspire"
      icon: "fas fa-fw fa-database"
      url: "https://inspirehep.net/authors/2729278"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=Gpo7ACkAAAAJ&hl=en"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0001-7232-6147"

# Footer Settings (Your custom branding request)
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/deepak-kamlesh"

# Build Configurations (Enables flawless Markdown processing)
markdown: kramdown
highlighter: rouge
kramdown:
  math_engine: mathjax # <-- Enables LaTeX equation rendering globally

# Core Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# File inclusions/exclusions
include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
